name: Publish to NuGet

on:
  push:
    tags:
      - 'primitives/v*'
      - 'components/v*'
      - 'icons-lucide/v*'
      - 'icons-heroicons/v*'
      - 'icons-feather/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - primitives
          - components
          - icons-lucide
          - icons-heroicons
          - icons-feather
      version:
        description: 'Version of an existing release tag (e.g., 4.5.4)'
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Determine package and version
        id: package-info
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGE="$REQUESTED_PACKAGE"
            VERSION="$REQUESTED_VERSION"
          else
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid package version"
            exit 1
          fi

          # Determine project path and display name
          case $PACKAGE in
            primitives)
              echo "project_path=src/NeoUI.Blazor.Primitives/NeoUI.Blazor.Primitives.csproj" >> $GITHUB_OUTPUT
              echo "display_name=NeoUI.Blazor.Primitives" >> $GITHUB_OUTPUT
              ;;
            components)
              echo "project_path=src/NeoUI.Blazor/NeoUI.Blazor.csproj" >> $GITHUB_OUTPUT
              echo "display_name=NeoUI.Blazor" >> $GITHUB_OUTPUT
              ;;
            icons-lucide)
              echo "project_path=src/NeoUI.Icons.Lucide/NeoUI.Icons.Lucide.csproj" >> $GITHUB_OUTPUT
              echo "display_name=NeoUI.Icons.Lucide" >> $GITHUB_OUTPUT
              ;;
            icons-heroicons)
              echo "project_path=src/NeoUI.Icons.Heroicons/NeoUI.Icons.Heroicons.csproj" >> $GITHUB_OUTPUT
              echo "display_name=NeoUI.Icons.Heroicons" >> $GITHUB_OUTPUT
              ;;
            icons-feather)
              echo "project_path=src/NeoUI.Icons.Feather/NeoUI.Icons.Feather.csproj" >> $GITHUB_OUTPUT
              echo "display_name=NeoUI.Icons.Feather" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown package: $PACKAGE"
              exit 1
              ;;
          esac

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release-ref=refs/tags/$PACKAGE/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.package-info.outputs.release-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          RELEASE_REF: ${{ steps.package-info.outputs.release-ref }}
        run: |
          source_commit=$(git rev-parse HEAD)
          if [ "$source_commit" != "$(git rev-parse "${RELEASE_REF}^{commit}")" ]; then
            echo "Checkout does not match the release tag"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git merge-base --is-ancestor "$source_commit" origin/main
          fi
          echo "Building $RELEASE_REF from $source_commit"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (for components package)
        if: steps.package-info.outputs.package == 'components'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages (components package)
        if: steps.package-info.outputs.package == 'components'
        run: npm install
        working-directory: src/NeoUI.Blazor

      - name: Build CSS (components package)
        if: steps.package-info.outputs.package == 'components'
        run: npm run build:css
        working-directory: src/NeoUI.Blazor

      - name: Restore dependencies
        run: |
          # For components package, use NuGet package references instead of project references
          if [ "${{ steps.package-info.outputs.package }}" = "components" ]; then
            dotnet restore ${{ steps.package-info.outputs.project_path }} -p:UsePackageReferences=true
          else
            dotnet restore ${{ steps.package-info.outputs.project_path }}
          fi

      - name: Build
        run: |
          # For components package, use NuGet package references instead of project references
          if [ "${{ steps.package-info.outputs.package }}" = "components" ]; then
            dotnet build ${{ steps.package-info.outputs.project_path }} --configuration Release --no-restore -p:UsePackageReferences=true
          else
            dotnet build ${{ steps.package-info.outputs.project_path }} --configuration Release --no-restore
          fi
          echo "Checking MinVer calculated version..."
          dotnet msbuild ${{ steps.package-info.outputs.project_path }} -getProperty:Version -p:Configuration=Release

      - name: Pack
        run: |
          # For components package, use NuGet package references instead of project references
          if [ "${{ steps.package-info.outputs.package }}" = "components" ]; then
            dotnet pack ${{ steps.package-info.outputs.project_path }} --configuration Release --no-build --output ./packages -p:UsePackageReferences=true
          else
            dotnet pack ${{ steps.package-info.outputs.project_path }} --configuration Release --no-build --output ./packages
          fi

      - name: Verify package version
        shell: bash
        run: |
          PACKAGE_FILE=$(ls ./packages/*.nupkg)
          echo "Created package: $PACKAGE_FILE"

          # Extract version from package filename
          # Remove package name prefix and .nupkg suffix
          PACKAGE_NAME="${{ steps.package-info.outputs.display_name }}"
          BASENAME=$(basename "$PACKAGE_FILE" .nupkg)
          PACKAGE_VERSION="${BASENAME#$PACKAGE_NAME.}"

          echo "Package name: $PACKAGE_NAME"
          echo "Package version: $PACKAGE_VERSION"
          echo "Expected version: ${{ steps.package-info.outputs.version }}"

          # Verify version matches
          if [ "$PACKAGE_VERSION" != "${{ steps.package-info.outputs.version }}" ]; then
            echo "❌ Version mismatch! Package has version $PACKAGE_VERSION but expected ${{ steps.package-info.outputs.version }}"
            echo "This usually means the git tag doesn't match the MinVer configuration."
            exit 1
          fi

          echo "✅ Version verified successfully"

      - name: Sign in to NuGet with Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: jimmyps

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Summary
        shell: bash
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ steps.package-info.outputs.display_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.package-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The package has been published to NuGet.org and should be available shortly." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on NuGet.org](https://www.nuget.org/packages/${{ steps.package-info.outputs.display_name }}/${{ steps.package-info.outputs.version }})" >> $GITHUB_STEP_SUMMARY
